# generated by matugen from the octopus template; edit matugen/templates/fuzzel.ini

[main]
font=Rubik:size=13
use-bold=yes
dpi-aware=no
prompt=""
placeholder=buscar
icon-theme=WhiteSur-dark
icons-enabled=yes
terminal=alacritty -e
layer=overlay
anchor=center
width=38
lines=8
horizontal-pad=24
vertical-pad=20
inner-pad=12
line-height=34
match-counter=no
image-size-ratio=0.4

[colors]
background={{colors.surface_container.default.hex_stripped}}ff
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.primary.default.hex_stripped}}ff
placeholder={{colors.on_surface_variant.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.secondary_container.default.hex_stripped}}ff
selection-text={{colors.on_secondary_container.default.hex_stripped}}ff
selection-match={{colors.primary.default.hex_stripped}}ff
counter={{colors.on_surface_variant.default.hex_stripped}}ff
border={{colors.outline_variant.default.hex_stripped}}ff

[border]
width=1
radius=28
selection-radius=16

[dmenu]
exit-immediately-if-empty=yes
