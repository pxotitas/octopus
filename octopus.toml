# Octopus settings; `octopus settings` edits this file.

language = "auto"

[bar]
position = "left"
width = 40
top = [
    "logo",
    "workspaces",
]
center = ["clock"]
bottom = [
    "tray",
    "battery",
    "controls",
]

[weather]
place = ""

[brightness]
screen = ""
keyboard = ""

[notifications]
timeout_ms = 5000
max_popups = 3

[media]
lyrics = true
