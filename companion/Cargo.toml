[package]
name = "octopus"
version = "0.1.0"
edition = "2021"
description = "Companion daemon for the Octopus shell: menus, control center, dash, notifications"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.9"
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }
gtk4-session-lock = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gio-unix = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
