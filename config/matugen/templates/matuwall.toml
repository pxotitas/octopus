# generated by matugen from the octopus template; edit config/matugen/templates/matuwall.toml

[general]
directory = "~/Imagens/wallpapers"
recursive = true
backend = "awww"

[backend.awww]
args = ["--transition-type", "grow", "--transition-pos", "center", "--transition-duration", "1.2", "--transition-fps", "60"]

[window]
position = "center"
background = "{{colors.surface_container.default.hex}}"
margin = 28
radius = 32
close_on_apply = true
close_on_focus_loss = true

[input]
mouse = true

[grid]
columns = 5
spacing = 14
radius = 20
border_width = 0
shadow_width = 0
ring_width = 3
visible_rows = 1
carousel = true
sort = "color"

[thumbnail]
width = 300
height = 169

[colors]
tile = "{{colors.surface_container_high.default.hex}}ff"
border = "{{colors.outline_variant.default.hex}}ff"
shadow = "#00000000"
ring = "{{colors.primary.default.hex}}ff"
spinner = "{{colors.on_surface_variant.default.hex}}ff"

[hooks]
on_apply = ["octopus-theme {path}"]
