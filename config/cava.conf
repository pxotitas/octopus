# Raw bars for the control center header; cava only runs while it is open.

[general]
bars = 16
framerate = 30
sleep_timer = 2

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 70
