# Octopus lock screen. `octopus lock` runs it; scripts/lock.py renders the
# palette, the shapes and the wallpaper into ~/.cache/octopus/lock, and the
# labels ask the companion for the date, the battery and the lyrics.

source = ~/.cache/octopus/lock/colors.conf
source = ~/.cache/octopus/lock/strings.conf

$lock = ~/.cache/octopus/lock
$font = Rubik

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = emphasized, 0.2, 0, 0, 1
    animation = fadeIn, 1, 4, emphasized
    animation = fadeOut, 1, 3, emphasized
    animation = inputFieldDots, 1, 2, emphasized
    animation = inputFieldColors, 1, 3, emphasized
    animation = inputFieldWidth, 1, 3, emphasized
}

background {
    path = $lock/wallpaper.jpg
    color = $surface
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.15
}

# battery, an island at the top

shape {
    size = 108, 40
    color = $surface_container
    rounding = -1
    position = 0, -20
    halign = center
    valign = top
}

label {
    text = cmd[update:30000] octopus now battery
    color = $on_surface
    font_family = $font
    font_size = 12
    position = 0, -29
    halign = center
    valign = top
}

# date and the clock, hours in a cookie and minutes in a clover

label {
    text = cmd[update:60000] octopus now date
    color = $on_surface
    font_family = $font
    font_size = 17
    position = 0, 268
    halign = center
    valign = center
}

image {
    path = $lock/cookie9.png
    size = 220
    rounding = 0
    border_size = 0
    position = -116, 112
    halign = center
    valign = center
    zindex = 0
}

image {
    path = $lock/clover4.png
    size = 220
    rounding = 0
    border_size = 0
    position = 116, 112
    halign = center
    valign = center
    zindex = 0
}

label {
    text = cmd[update:1000] date +'<span font_weight="600">%H</span>'
    color = $on_primary_container
    font_family = $font
    font_size = 80
    position = -116, 112
    halign = center
    valign = center
    zindex = 1
}

label {
    text = cmd[update:1000] date +'<span font_weight="600">%M</span>'
    color = $on_tertiary_container
    font_family = $font
    font_size = 80
    position = 116, 112
    halign = center
    valign = center
    zindex = 1
}

# password

input-field {
    size = 320, 56
    rounding = -1
    outline_thickness = 2
    outer_color = $surface_container_high
    inner_color = $surface_container_high
    font_color = $on_surface
    font_family = $font
    check_color = $tertiary
    fail_color = $error
    capslock_color = $secondary
    dots_size = 0.24
    dots_spacing = 0.35
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = $placeholder
    fail_text = $fail
    position = 0, -64
    halign = center
    valign = center
}

# what is playing: cover, the lyric being sung, title and artist

image {
    path = $lock/blank.png
    reload_cmd = octopus now art
    reload_time = 2
    size = 72
    rounding = 22
    border_size = 0
    position = 0, 132
    halign = center
    valign = bottom
}

label {
    text = cmd[update:500] octopus now line
    color = $primary
    font_family = $font
    font_size = 20
    position = 0, 84
    halign = center
    valign = bottom
}

label {
    text = cmd[update:3000] octopus now song
    color = $on_surface_variant
    font_family = $font
    font_size = 12
    position = 0, 52
    halign = center
    valign = bottom
}
